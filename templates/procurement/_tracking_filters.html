<form
  method="get"
  class="tracking-filters"
  aria-label="Pencarian dan Filter Pengadaan"
>
  {% for field in filter_form %}
  <div class="filter-field{% if field.name == 'q' %} filter-search{% endif %}">
    {{ field.label_tag }}{{ field }}{{ field.errors }}
  </div>
  {% endfor %}
  {{ filter_form.non_field_errors }}
  <div class="filter-actions">
    <button type="submit">Terapkan Pencarian dan Filter</button>
    {% if has_filters %}<a href="{{ request.path }}">Hapus Filter</a
    >{% endif %}
  </div>
</form>
